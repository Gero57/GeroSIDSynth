name: Build macOS VST3

on:
  push:
    branches: [ main, feature/chip-modulation ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build arm64 VST3
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcodebuild -version
          cmake --version

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0

      - name: Build VST3
        run: cmake --build build --config Release --target GeroSIDSynth_VST3 --parallel 3

      - name: Package VST3
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            "build/GeroSIDSynth_artefacts/Release/VST3/Gero SID Synth.vst3" \
            "dist/GeroSIDSynth-macOS-arm64-VST3.zip"

      - name: Package corresponding source
        run: |
          test -d build/_deps/residfp-src
          tar -czf dist/GeroSIDSynth-corresponding-source.tar.gz \
            --exclude=.git --exclude=build --exclude=dist . \
            build/_deps/residfp-src

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GeroSIDSynth-macOS-arm64
          path: |
            dist/GeroSIDSynth-macOS-arm64-VST3.zip
            dist/GeroSIDSynth-corresponding-source.tar.gz
          if-no-files-found: error
          retention-days: 30
